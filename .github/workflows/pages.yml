name: Deploy Landing Page to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "docs/index.html"
      - "assets/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Landing Page
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Stage static site
        run: |
          mkdir -p _site/assets/icons
          cp index.html _site/index.html
          cp assets/editor-dark.png _site/assets/editor-dark.png
          cp assets/editor-light.png _site/assets/editor-light.png
          cp assets/editor.png _site/assets/editor.png
          cp assets/icons/chillstudio_logo_*.png _site/assets/icons/
          cp assets/icons/chillstudio.ico _site/assets/icons/
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
